# SPS Media Monitor — Netlify config
# Static dashboard + serverless backend (Supabase-backed).

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Serve the dashboard at the root
[[redirects]]
  from = "/"
  to   = "/sps-monitor.html"
  status = 200
