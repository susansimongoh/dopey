<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPS Media Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f5f7fa;
      color: #1a2332;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    /* HEADER */
    .header {
      background: #fff;
      padding: 20px 0;
      margin-bottom: 30px;
      border-bottom: 1px solid #e0e6ed;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .header-left h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header-left p {
      font-size: 13px;
      color: #6b7a8d;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* BUTTONS */
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-primary {
      background: #0070f3;
      color: white;
    }
    .btn-primary:hover {
      background: #0051cc;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0,112,243,.3);
    }

    .btn-secondary {
      background: white;
      color: #1a2332;
      border: 1px solid #e0e6ed;
    }
    .btn-secondary:hover {
      background: #f9fafb;
      border-color: #d0d8e0;
    }

    .btn-danger {
      background: #ff4757;
      color: white;
    }
    .btn-danger:hover {
      background: #e63946;
    }

    /* STATS ROW */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e0e6ed;
    }

    .stat-label {
      font-size: 12px;
      color: #6b7a8d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #1a2332;
      margin-bottom: 4px;
    }

    .stat-note {
      font-size: 12px;
      color: #9ca3af;
    }

    /* CONTENT GRID */
    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 30px;
    }

    @media (max-width: 1024px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    /* CARDS */
    .card {
      background: white;
      border-radius: 8px;
      border: 1px solid #e0e6ed;
      overflow: hidden;
    }

    .card-header {
      padding: 18px 20px;
      border-bottom: 1px solid #e0e6ed;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a2332;
    }

    .card-body {
      padding: 20px;
    }

    /* CATEGORY LIST */
    .category-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .category-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #f9fafb;
      border-radius: 6px;
      font-size: 13px;
    }

    .category-name {
      font-weight: 600;
      color: #1a2332;
    }

    .category-count {
      background: #0070f3;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    /* CLIPS LIST */
    .clips-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
    }

    .clip-item {
      padding: 12px;
      background: #f9fafb;
      border-radius: 6px;
      font-size: 12px;
      border-left: 3px solid #0070f3;
    }

    .clip-title {
      font-weight: 600;
      color: #1a2332;
      margin-bottom: 4px;
    }

    .clip-meta {
      color: #6b7a8d;
      font-size: 11px;
    }

    /* ACTION BUTTONS SECTION */
    .action-section {
      margin-bottom: 30px;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-buttons .btn {
      flex: 0 1 auto;
    }

    /* FULL WIDTH SECTION */
    .full-width {
      grid-column: 1 / -1;
    }

    /* MESSAGE */
    .message {
      background: #ecfdf5;
      border: 1px solid #86efac;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 20px;
      color: #166534;
      font-size: 13px;
    }

    .message.loading {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .container {
        padding: 16px;
      }

      .header-content {
        flex-direction: column;
        align-items: flex-start;
      }

      .header-actions {
        width: 100%;
        margin-top: 16px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .action-buttons {
        flex-direction: column;
      }

      .action-buttons .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <div class="header">
    <div class="header-content">
      <div class="header-left">
        <h1>SPS Media Monitor</h1>
        <p id="headerDate">Monday, 8 June 2026</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="fetchLiveData()">📡 Fetch Live Data</button>
        <button class="btn btn-secondary" onclick="addClip()">+ Add Clip</button>
        <button class="btn btn-secondary" onclick="downloadReport()">⬇ Export Report</button>
      </div>
    </div>
    <div id="statusMessage"></div>
  </div>

  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Clips</div>
      <div class="stat-value" id="totalClips">0</div>
      <div class="stat-note">logged today</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Stories</div>
      <div class="stat-value" id="totalStories">0</div>
      <div class="stat-note">summarised</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">High Traction</div>
      <div class="stat-value" id="highTraction">0</div>
      <div class="stat-note">stories to watch</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Report No.</div>
      <div class="stat-value" id="reportNumber">–</div>
      <div class="stat-note" id="reportDate">–</div>
    </div>
  </div>

  <!-- MAIN CONTENT GRID -->
  <div class="content-grid">
    <!-- LEFT: CATEGORIES -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">Stories by Category</div>
      </div>
      <div class="card-body">
        <div class="category-list" id="categoriesList">
          <div class="category-item">
            <span class="category-name">Daily News</span>
            <span class="category-count">0</span>
          </div>
          <div class="category-item">
            <span class="category-name">Yellow Ribbon News</span>
            <span class="category-count">0</span>
          </div>
          <div class="category-item">
            <span class="category-name">Issues Monitoring</span>
            <span class="category-count">0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: LATEST CLIPS -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">Latest Clips</div>
      </div>
      <div class="card-body">
        <div class="clips-list" id="latestClips">
          <div style="color: #9ca3af; font-size: 12px;">No clips yet</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ACTION BUTTONS - FULL WIDTH -->
  <div class="action-section">
    <div style="margin-bottom: 12px;">
      <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 12px;">Quick Actions</h3>
    </div>
    <div class="action-buttons">
      <button class="btn btn-secondary" onclick="addClip()">📎 Add Clip</button>
      <button class="btn btn-secondary" onclick="addStory()">📝 Add Story</button>
      <button class="btn btn-secondary" onclick="viewReport()">👁 View Report</button>
      <button class="btn btn-secondary" onclick="printReport()">🖨 Print / PDF</button>
      <button class="btn btn-secondary" onclick="saveSession()">💾 Save Session</button>
      <button class="btn btn-secondary" onclick="loadYesterday()" style="border-color: #93c5fd; color: #1d4ed8;">🗞 Load Yesterday</button>
      <button class="btn btn-secondary" onclick="loadExample()" style="border-color: #6ee7b7; color: #065f46;">📅 Load Example Day</button>
    </div>
  </div>

</div>

<script>
  // Sample data structure
  let appState = {
    clips: [
      { id: 1, title: 'Various (anti-death penalty groups)', date: '22 May 2026', category: 'Issues' },
      { id: 2, title: 'Ministry of Law', date: '8 June 2026', category: 'Daily News' },
      { id: 3, title: 'Ministry of Home Affairs', date: '8 June 2026', category: 'Daily News' },
      { id: 4, title: 'Geneco SG / YTL Power Seraya', date: '8 June 2026', category: 'Daily News' },
      { id: 5, title: 'Ministry of Home Affairs', date: '8 June 2026', category: 'Yellow Ribbon' },
      { id: 6, title: 'Ministry of Health', date: '7 June 2026', category: 'Daily News' },
    ],
    stories: [
      { id: 1, title: 'Leadership changes in Singapore', category: 'Daily News' },
      { id: 2, title: 'Execution carried out', category: 'Issues' },
      { id: 3, title: 'Yellow Ribbon Appreciation Awards', category: 'Yellow Ribbon' },
      { id: 4, title: 'Retail sector updates', category: 'Daily News' },
      { id: 5, title: 'Speech by SMS Murali Pillai', category: 'Daily News' },
      { id: 6, title: 'Community engagement initiatives', category: 'Yellow Ribbon' },
    ]
  };

  function render() {
    const today = new Date();
    document.getElementById('headerDate').textContent = today.toLocaleDateString('en-US', {
      weekday: 'long',
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });

    // Update stats
    document.getElementById('totalClips').textContent = appState.clips.length;
    document.getElementById('totalStories').textContent = appState.stories.length;
    document.getElementById('highTraction').textContent = Math.floor(appState.stories.length * 0.3);
    document.getElementById('reportNumber').textContent = '101/2026';
    document.getElementById('reportDate').textContent = today.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

    // Render latest clips
    const latestClips = appState.clips.slice(0, 5);
    document.getElementById('latestClips').innerHTML = latestClips.map(clip => `
      <div class="clip-item">
        <div class="clip-title">${clip.title}</div>
        <div class="clip-meta">${clip.date} • ${clip.category}</div>
      </div>
    `).join('') || '<div style="color: #9ca3af; font-size: 12px;">No clips yet</div>';

    // Render categories
    const categories = {};
    appState.clips.forEach(clip => {
      categories[clip.category] = (categories[clip.category] || 0) + 1;
    });

    const categoryNames = {
      'Daily News': 'Daily News',
      'Yellow Ribbon': 'Yellow Ribbon News',
      'Issues': 'Issues Monitoring'
    };

    document.getElementById('categoriesList').innerHTML = Object.entries(categoryNames).map(([key, label]) => `
      <div class="category-item">
        <span class="category-name">${label}</span>
        <span class="category-count">${categories[key] || 0}</span>
      </div>
    `).join('');
  }

  function fetchLiveData() {
    const msg = document.getElementById('statusMessage');
    msg.innerHTML = '<div class="message loading">📡 Fetching live data...</div>';
    setTimeout(() => {
      appState.clips.push({
        id: appState.clips.length + 1,
        title: 'New story from Apify',
        date: new Date().toLocaleDateString(),
        category: 'Daily News'
      });
      msg.innerHTML = '<div class="message">✅ Data refreshed successfully</div>';
      render();
      setTimeout(() => { msg.innerHTML = ''; }, 3000);
    }, 1500);
  }

  function addClip() {
    alert('Add Clip - form would open here');
  }

  function addStory() {
    alert('Add Story - form would open here');
  }

  function viewReport() {
    alert('Report preview would open here');
  }

  function printReport() {
    window.print();
  }

  function saveSession() {
    alert('Session saved to browser');
  }

  function loadYesterday() {
    alert('Loading yesterday\'s data...');
    render();
  }

  function loadExample() {
    alert('Loading example day (27-28 May)...');
    render();
  }

  function downloadReport() {
    alert('Report exported as PDF');
  }

  // Initial render
  document.addEventListener('DOMContentLoaded', render);
</script>

</body>
</html>
